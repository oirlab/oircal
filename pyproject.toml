[build-system]
requires = ["setuptools>=64", "wheel", "setuptools_scm>=8", "cython==3.2.4", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_file = "oircal/_version.py"
version_scheme = "post-release"
fallback_version = "0.0.0"

[project]
name = "oircal"
dynamic = ["version"]
description = "Array-level detector and spectral calibration algorithms (ramp fitting, jump detection, detector corrections, combining) from the UCSD Optical-Infrared Laboratory."
readme = "README.md"
requires-python = ">=3.13"

authors = [
  {name = "Bryson Cale", email = "brcale@ucsd.edu" },
  {name = "Jean-Baptiste Ruffio", email = "jruffio@ucsd.edu" },
  {name = "Charlie Kilpatrick", email = "ckilpatrick@northwestern.edu" }
]

maintainers = [
  {name = "Bryson Cale", email = "brcale@ucsd.edu" },
  {name = "Jean-Baptiste Ruffio", email = "jruffio@ucsd.edu" },
  {name = "Charlie Kilpatrick", email = "ckilpatrick@northwestern.edu" }
]


classifiers = [
  "Development Status :: 1 - Planning",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  # numba>=0.66 is required for NumPy 2.4+; older numba raises ImportError at import.
  "numpy>=2.1",
  "scipy",
  "numba>=0.66.0",
  "stcal==1.15.2",
  "progressbar2",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
dev = ["ruff==0.16.10"]
docs = ["sphinx>=9.1.0", "nbsphinx", "sphinx-astropy", "pandoc", "sphinx-multiversion", "sphinxawesome-theme==6.0.0"]

[project.urls]
"Source" = "https://github.com/oirlab/oircal"
"Documentation" = "https://oirlab.github.io/oircal/"

[tool.setuptools.packages.find]
where = ["."]
include = ["oircal*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "UP",      # pyupgrade
  "B",       # flake8-bugbear
  "NPY",     # NumPy-specific
  "SIM",     # flake8-simplify
  "C4",      # flake8-comprehensions
  "COM812",  # trailing comma on multi-line constructs, so ruff explodes them one item per line
]
ignore = [
  "E501",  # line length is handled by the formatter
  "B905",  # zip() without strict=
  "NPY002",  # legacy np.random.* calls; switching to Generator changes random streams
]

[tool.ruff.lint.isort]
known-first-party = ["oircal"]
force-sort-within-sections = true
lines-after-imports = 2
